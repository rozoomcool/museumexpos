name: chrexpo
description: "Экспонаты ЧР — интерактивный каталог музейных экспонатов с 3D-моделями."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Просмотр GLB через локально встроенный model-viewer (без обращений к сети).
  flutter_3d_controller: ^2.3.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/thumbs/
    - assets/photos/
    - assets/models/
    - assets/images/brand/

  fonts:
    # Дизайн-система музея ЧГУ: Literata — заголовки и крупные числа,
    # Manrope — текст и интерфейс. Лицензии OFL лежат рядом с файлами.
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
